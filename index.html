        }

            flex: 1;
            padding: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            background: transparent;
        }

        #search-btn {
            background: #ddd;
            border: 2px outset #ccc;
            padding: 6px 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
        }
        #search-btn:active { border: 2px inset #ccc; }

            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        }

            align-items: center;

        }

            border: 2px solid #000;
            padding: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            flex: 1;
        }

        .top-bar-btn {
            background: #000;
            color: #fff;
            border: 2px solid #000;
            padding: 6px 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;

            border-left: 4px solid #00aa00;
        }

            font-size: 14px;
            color: #0000cc;
            text-decoration: underline;

        function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (query === "") {
                alert("Please enter a search term!");
                return;
            }
            showResults(query);
        }

        function performSearchFromResults() {
            const query = document.getElementById('result-search-input').value.trim();
            if (query === "") {

                return;
            }
            showResults(query);

        function showResults(query) {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('results-page').style.display = 'block';
            document.getElementById('result-search-input').value = query;
            performSearchLogic(query);
        }

        function performSearchLogic(query) {
            const results = allSites.filter(site => {
                const searchTerm = query.toLowerCase();
                const titleMatch = site.title.toLowerCase().includes(searchTerm);
                const descMatch = site.description.toLowerCase().includes(searchTerm);
                const urlMatch = site.url.toLowerCase().includes(searchTerm);
                return titleMatch || descMatch || urlMatch;
            });

            currentResults = results;
            currentPage = 1;
            displayResults(results, query);
        }

        function displayResults(results, query) {
            const resultsList = document.getElementById('results-list');
            const resultStats = document.getElementById('result-stats');
            const pagination = document.getElementById('pagination-container');
            
            resultsList.innerHTML = '';
            
            const totalResults = results.length;
            const searchTime = (Math.random() * 0.5 + 0.1).toFixed(2);
            resultStats.innerHTML = `🔍 Found <strong>${totalResults}</strong> results for "<strong>${query}</strong>" (${searchTime}s)`;
            
            if (totalResults === 0) {
                resultsList.innerHTML = `
                    <div class="no-results">
                        🕷️ No results found for "${query}"<br>
                        <div class="suggestion">Try different keywords or search again</div>
                    </div>
                `;
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'block';
            updatePagination();
            
            const start = (currentPage - 1) * resultsPerPage;
            const end = Math.min(start + resultsPerPage, results.length);
            const pageResults = results.slice(start, end);
            
            pageResults.forEach((result) => {
                const item = document.createElement('div');
                item.className = 'result-item';
                
                let description = result.description || 'No description available';
                if (query) {
                    const regex = new RegExp(`(${query})`, 'gi');
                    description = description.replace(regex, '<strong>$1</strong>');
                }
                
                item.innerHTML = `
                    <div class="result-title" onclick="window.open('${result.url}', '_blank')">${result.title}</div>
                    <div class="result-url">${result.url}</div>
                    <div class="result-description">${description}</div>
                `;
                
                resultsList.appendChild(item);
            });
        }

        function changePage(delta) {
            const totalPages = Math.ceil(currentResults.length / resultsPerPage);
            const newPage = currentPage + delta;
            
            if (newPage < 1 || newPage > totalPages) return;
            
            currentPage = newPage;
            const query = document.getElementById('result-search-input').value;
            displayResults(currentResults, query);
        }

        function updatePagination() {
            const totalPages = Math.ceil(currentResults.length / resultsPerPage);
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
        }

        function goHome() {
            document.getElementById('results-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'flex';
            document.getElementById('search-input').value = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const homeInput = document.getElementById('search-input');
                const resultsInput = document.getElementById('result-search-input');
                
                if (document.activeElement === homeInput) {
                    performSearch();
                } else if (document.activeElement === resultsInput) {
                    performSearchFromResults();
                }
            }
        });

        console.log('🕷️ Trawler loaded! 1,000+ sites ready to search.');
    </script>
</body>
</html>
