    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body {
            background: #ffffff;
            font-family: 'Press Start 2P', cursive;
            color: #000;
        }

        #home-page {
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        #logo-img {
            max-width: 80%;
            height: auto;
            background: #ffffff;
            margin-bottom: 20px;
            image-rendering: pixelated;
        }

        .search-box {
            background: #000;
            padding: 4px;
            width: 90%;
            max-width: 500px;
            border: 3px solid #222;
        }

        .search-container {
            background: #fff;
            display: flex;
            padding: 4px;
            border: 2px solid #ccc;
        }

        .search-label {
            font-size: 14px;
            padding: 0 10px;
            border-right: 2px solid #ccc;
            display: flex;
            align-items: center;
            font-family: 'Press Start 2P', cursive;
        }

        #search-input {
            border: none;
            outline: none;
            flex: 1;
            padding: 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            background: transparent;
        }

        #search-btn {
            background: #ddd;
            border: 2px outset #ccc;
            padding: 6px 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 10px;
            cursor: pointer;
        }
        #search-btn:active { border: 2px inset #ccc; }

        /* RESULTS PAGE */
        #results-page {
            display: none;
            padding: 20px;
            max-width: 800px;
            margin: 0 auto;
        }

        .top-bar {
            border-bottom: 3px solid #000;
            padding-bottom: 15px;
            margin-bottom: 20px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            flex-wrap: wrap;
            gap: 10px;
        }

        .top-bar-left {
            display: flex;
            align-items: center;
            gap: 10px;
        }

        .mini-logo {
            height: 30px;
            background: #ffffff;
        }

        .top-bar-search {
            display: flex;
            align-items: center;
            flex: 1;
            max-width: 400px;
        }

        .top-bar-input {
            border: 2px solid #000;
            padding: 6px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            flex: 1;
        }

        .top-bar-btn {
            background: #000;
            color: #fff;
            border: 2px solid #000;
            padding: 6px 12px;
            font-family: 'Press Start 2P', cursive;
            font-size: 9px;
            cursor: pointer;
        }
        .top-bar-btn:hover { background: #fff; color: #000; }

        .result-stats {
            font-size: 10px;
            color: #555;
            padding: 8px;
            background: #f5f5f5;
            border: 1px solid #ddd;
            margin-bottom: 15px;
        }

        .result-item {
            margin-bottom: 20px;
            padding: 10px;
            border: 1px solid #eee;
            border-left: 4px solid #00aa00;
        }
        .result-item:hover { background: #fafafa; }

        .result-title {
            font-size: 14px;
            color: #0000cc;
            text-decoration: underline;
            cursor: pointer;
            font-family: 'Courier New', monospace;
        }
        .result-title:hover { color: #cc0000; }

        .result-url {
            font-size: 9px;
            color: #006600;
            margin: 4px 0;
        }

        .result-description {
            font-size: 11px;
            color: #333;
            font-family: 'Courier New', monospace;
            line-height: 1.5;
        }

        .no-results {
            padding: 30px;
            text-align: center;
            border: 3px dashed #ccc;
            font-size: 12px;
            color: #555;
        }

        .pagination {
            margin-top: 20px;
            text-align: center;
            font-size: 10px;
        }
        .pagination button {
            background: #eee;
            border: 2px solid #ccc;
            padding: 4px 8px;
            font-family: 'Press Start 2P', cursive;
            font-size: 8px;
            cursor: pointer;
            margin: 0 2px;
        }
        .pagination button:hover { background: #ddd; }

        @media (max-width: 600px) {
            .search-label { font-size: 10px; }
            #search-input, .top-bar-input { font-size: 8px; }
            .result-title { font-size: 12px; }
            .result-description { font-size: 10px; }
        }

        .back-link {
            color: #0000cc;
            text-decoration: underline;
            cursor: pointer;
            font-size: 10px;
            display: block;
            text-align: center;
            margin-top: 20px;
        }
    </style>

        </div>

        <a class="back-link" onclick="goHome()">[ return to home page ]</a>
    </div>

            { "url": "https://www.eurogamer.net", "title": "Eurogamer", "description": "Gaming news and reviews." },
            { "url": "https://www.discord.com", "title": "Discord", "description": "Chat platform for gamers." },
            { "url": "https://www.roblox.com", "title": "Roblox", "description": "Online game platform." },
            { "url": "https://www.leagueoflegends.com", "title": "League of Legends", "description": "MOBA game." },
            { "url": "https://www.dota2.com", "title": "Dota 2", "description": "MOBA game." },
            { "url": "https://www.valorant.com", "title": "Valorant", "description": "Tactical shooter game." },
            { "url": "https://www.apexlegends.com", "title": "Apex Legends", "description": "Battle royale game." },
            { "url": "https://www.gog.com", "title": "GOG", "description": "DRM-free game store." },
            { "url": "https://www.humblebundle.com", "title": "Humble Bundle", "description": "Game bundle site." },
            { "url": "https://www.itch.io", "title": "itch.io", "description": "Indie game platform." },
            { "url": "https://www.nintendo.com", "title": "Nintendo", "description": "Nintendo official site." },
            { "url": "https://www.playstation.com", "title": "PlayStation", "description": "PlayStation official site." },
            { "url": "https://www.xbox.com", "title": "Xbox", "description": "Xbox official site." },
            { "url": "https://www.chat.openai.com", "title": "ChatGPT", "description": "AI chatbot by OpenAI." },
            { "url": "https://www.claude.ai", "title": "Claude", "description": "AI assistant by Anthropic." },
            { "url": "https://www.gemini.google.com", "title": "Gemini", "description": "AI by Google." },
            { "url": "https://www.perplexity.ai", "title": "Perplexity", "description": "AI search engine." },
            { "url": "https://www.deepseek.com", "title": "DeepSeek", "description": "AI chat platform." }
        ];

        // ==========================================
        // SEARCH FUNCTIONALITY
        // ==========================================

        let currentResults = [];
        let currentPage = 1;
        const resultsPerPage = 10;

        console.log(`✅ Loaded ${allSites.length} sites from embedded data`);

        function performSearch() {
            const query = document.getElementById('search-input').value.trim();
            if (query === "") {
                alert("Please enter a search term!");
                return;
            }
            showResults(query);
        }

        function performSearchFromResults() {
            const query = document.getElementById('result-search-input').value.trim();
            if (query === "") {
                alert("Please enter a search term!");
                return;
            }
            showResults(query);
        }

        function showResults(query) {
            document.getElementById('home-page').style.display = 'none';
            document.getElementById('results-page').style.display = 'block';
            document.getElementById('result-search-input').value = query;
            performSearchLogic(query);
        }

        function performSearchLogic(query) {
            const searchTerm = query.toLowerCase().trim();
            
            const results = allSites.filter(site => {
                const title = (site.title || '').toLowerCase();
                const description = (site.description || '').toLowerCase();
                const url = (site.url || '').toLowerCase();
                
                const titleMatch = title.includes(searchTerm);
                const descMatch = description.includes(searchTerm);
                const urlMatch = url.includes(searchTerm);
                
                // Also check domain name
                const domain = url.replace('https://', '').replace('http://', '').replace('www.', '').split('/')[0];
                const domainMatch = domain.includes(searchTerm);
                
                return titleMatch || descMatch || urlMatch || domainMatch;
            });

            currentResults = results;
            currentPage = 1;
            displayResults(results, query);
        }

        function displayResults(results, query) {
            const resultsList = document.getElementById('results-list');
            const resultStats = document.getElementById('result-stats');
            const pagination = document.getElementById('pagination-container');
            
            resultsList.innerHTML = '';
            
            const totalResults = results.length;
            const searchTime = (Math.random() * 0.5 + 0.1).toFixed(2);
            resultStats.innerHTML = `🔍 Found <strong>${totalResults}</strong> results for "<strong>${query}</strong>" (${searchTime}s)`;
            
            if (totalResults === 0) {
                resultsList.innerHTML = `
                    <div class="no-results">
                        🕷️ No results found for "${query}"<br>
                        <div class="suggestion">Try different keywords or search again</div>
                    </div>
                `;
                pagination.style.display = 'none';
                return;
            }
            
            pagination.style.display = 'block';
            updatePagination();
            
            const start = (currentPage - 1) * resultsPerPage;
            const end = Math.min(start + resultsPerPage, results.length);
            const pageResults = results.slice(start, end);
            
            pageResults.forEach((result) => {
                const item = document.createElement('div');
                item.className = 'result-item';
                
                let description = result.description || 'No description available';
                if (query) {
                    const regex = new RegExp(`(${query})`, 'gi');
                    description = description.replace(regex, '<strong>$1</strong>');
                }
                
                item.innerHTML = `
                    <div class="result-title" onclick="window.open('${result.url}', '_blank')">${result.title || 'Untitled'}</div>
                    <div class="result-url">${result.url}</div>
                    <div class="result-description">${description}</div>
                `;
                
                resultsList.appendChild(item);
            });
        }

        function changePage(delta) {
            const totalPages = Math.ceil(currentResults.length / resultsPerPage);
            const newPage = currentPage + delta;
            
            if (newPage < 1 || newPage > totalPages) return;
            
            currentPage = newPage;
            const query = document.getElementById('result-search-input').value;
            displayResults(currentResults, query);
        }

        function updatePagination() {
            const totalPages = Math.ceil(currentResults.length / resultsPerPage);
            document.getElementById('page-info').textContent = `Page ${currentPage} of ${totalPages}`;
        }

        function goHome() {
            document.getElementById('results-page').style.display = 'none';
            document.getElementById('home-page').style.display = 'flex';
            document.getElementById('search-input').value = '';
        }

        document.addEventListener('keydown', function(e) {
            if (e.key === 'Enter') {
                const homeInput = document.getElementById('search-input');
                const resultsInput = document.getElementById('result-search-input');
                
                if (document.activeElement === homeInput) {
                    performSearch();
                } else if (document.activeElement === resultsInput) {
                    performSearchFromResults();
                }
            }
        });

        console.log('🕷️ Trawler Search Engine ready!');
    </script>
</body>
</html>
